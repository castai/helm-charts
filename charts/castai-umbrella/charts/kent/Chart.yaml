apiVersion: v2
name: kent
description: Wrapper chart for CAST AI Kent profile.
type: application
version: 0.17.0
dependencies:
  - name: castai-agent
    version: "0.163.0"
    repository: "https://castai.github.io/helm-charts"
    condition: castai-agent.enabled
  - name: castai-cluster-controller
    version: "0.92.23"
    repository: "https://castai.github.io/helm-charts"
    condition: castai-cluster-controller.enabled
  - name: castai-kentroller
    version: "0.34.3"
    repository: "https://castai.github.io/helm-charts"
    condition: castai-kentroller.enabled
  - name: castai-workload-autoscaler
    version: "1.19.0"
    repository: "https://castai.github.io/helm-charts"
    condition: castai-workload-autoscaler.enabled
  - name: castai-workload-autoscaler-exporter
    version: "1.19.0"
    repository: "https://castai.github.io/helm-charts"
    condition: castai-workload-autoscaler-exporter.enabled
  - name: castai-live
    version: "0.143.1"
    repository: "https://castai.github.io/helm-charts"
    condition: castai-live.enabled
  - name: castai-pod-mutator
    version: "0.17.13"
    repository: "https://castai.github.io/helm-charts"
    condition: castai-pod-mutator.enabled
  - name: castai-spot-handler
    version: "0.35.14"
    repository: "https://castai.github.io/helm-charts"
    condition: castai-spot-handler.enabled
  - name: metrics-server
    version: "3.13.0"
    repository: "https://kubernetes-sigs.github.io/metrics-server/"
    condition: metrics-server.enabled
  - name: castai-kvisor
    version: "1.166.2"
    repository: "https://castai.github.io/helm-charts"
    condition: castai-kvisor.enabled
  - name: castai-chart-upgrader
    version: "0.2.1"
    repository: "https://castai.github.io/helm-charts"
    condition: castai-chart-upgrader.enabled
  # ── opt-in (disabled by default via castai-storage-autoscaler.enabled=false) ──
  # Enable with --set kent.castai-storage-autoscaler.enabled=true.
  - name: castai-storage-autoscaler
    version: "0.3.1"
    repository: "https://castai.github.io/helm-charts"
    condition: castai-storage-autoscaler.enabled
