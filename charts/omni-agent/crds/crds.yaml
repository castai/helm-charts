  name: clusters.omni.cast.ai
spec:
  group: omni.cast.ai
  names:
    categories:
    - omni
    kind: Cluster
    listKind: ClusterList
    plural: clusters
    singular: cluster
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Cluster is the Schema for the edge clusters API.
