            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ClusterSpec defines the desired state of Cluster.
            properties:
              provider:
                description: Provider is provider specific configuration.
                properties:
                  kind:
                    description: ProviderKind defines the type of the provider.
                    type: string
                  liqo:
                    description: LiqoManagementProvider is the provider specific configuration
                      for management cluster.
                    properties:
                      clusterID:
                        description: ClusterID liqo cluster ID.
                        type: string
                    type: object
                type: object
            type: object
          status:
            description: ClusterStatus defines the observed state of Cluster.
            properties:
              conditions:
                description: Current processing state of the Cluster proxy.
                items:
                  description: Condition defines an observation of a object operational
                    state.
                  properties:
                    lastTransitionTime:
                      description: |-
                        Last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed. If that is not known, then using the time when
                        the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A human readable message indicating details about the transition.
                        This field may be empty.
                      type: string
                    reason:
                      description: |-
                        The reason for the condition's last transition in CamelCase.
                        The specific API may choose whether or not this field is considered a guaranteed API.
                        This field may not be empty.
                      type: string
                    severity:
                      description: |-
                        Severity provides an explicit classification of Reason code, so the users or machines can immediately
                        understand the current situation and act accordingly.
                        The Severity field MUST be set only when Status=False.
                      type: string
                    status:
                      description: Status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: |-
                        Type of condition in CamelCase or in foo.example.com/CamelCase.
                        Many .condition.type values are consistent across resources like Available, but because arbitrary conditions
                        can be useful (see .node.status.conditions), the ability to deconflict is important.
                      type: string
                  required:
                  - lastTransitionTime
                  - status
                  - type
                  type: object
                type: array
              deadManSwitch:
                description: |-
                  DeadManSwitch is the time when the cluster proxy was last seen.
                  It will drive to report each 5 minutes when lapses.
                format: date-time
                type: string
              network:
                description: Network contains observed network configuration from
                  liqo IPAM.
                properties:
                  externalCIDR:
                    description: ExternalCIDR is the external CIDR for the cluster,
                      discovered from liqo IPAM.
                    type: string
                  podCIDR:
                    description: PodCIDR is the CIDR for the pods in the cluster.
                    type: string
                type: object
              phase:
                default: Creating
                description: Phase of the cluster proxy (Creating, Ready, Failed,
                  Deleting, Deleted).
                enum:
                - Creating
                - Ready
                - Failed
                - Unknown
                - Deleting
                - Deleted
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
