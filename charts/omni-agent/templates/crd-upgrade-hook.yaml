{{- if and .Values.upgradecrds .Values.upgradecrds.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "omni-agent.fullname" . }}-crd-upgrade
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "omni-agent.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "omni-agent.fullname" . }}-crd-upgrade
  labels:
    {{- include "omni-agent.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "omni-agent.fullname" . }}-crd-upgrade
  labels:
    {{- include "omni-agent.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "omni-agent.fullname" . }}-crd-upgrade
subjects:
  - kind: ServiceAccount
    name: {{ include "omni-agent.fullname" . }}-crd-upgrade
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "omni-agent.fullname" . }}-crds
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "omni-agent.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
data:
  crds.yaml: |
{{- .Files.Get "crds/crds.yaml" | nindent 4 }}
  k0smotron-crds.yaml: |
{{- .Files.Get "crds/k0smotron-crds.yaml" | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "omni-agent.fullname" . }}-crd-upgrade
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "omni-agent.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 60
  template:
    metadata:
      labels:
        {{- include "omni-agent.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "omni-agent.fullname" . }}-crd-upgrade
      restartPolicy: OnFailure
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: crd-upgrade
          image: "{{ .Values.upgradecrds.image.repository }}:{{ .Values.upgradecrds.image.tag }}"
          imagePullPolicy: {{ .Values.upgradecrds.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Applying CRDs..."
              kubectl apply --server-side --force-conflicts -f /crds/
              echo "CRDs applied successfully"
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: crds
              mountPath: /crds
              readOnly: true
      volumes:
        - name: crds
          configMap:
            name: {{ include "omni-agent.fullname" . }}-crds
{{- end }}