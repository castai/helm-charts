replicas: 2

# -- Rolling update strategy configuration.
rollingUpdate:
  # -- Maximum number of pods that can be created above the desired number of pods during an update.
  maxSurge: "100%"
  # -- Maximum number of pods that can be unavailable during an update.
  maxUnavailable: 0

# -- URL to the CAST AI gRPC API server.
apiURL: "api-grpc.cast.ai"

# -- Token to be used for authorizing access to the CAST AI API.
apiKey: ""

# apiKeySecretRef -- Name of secret with Token to be used for authorizing access to the API.
# apiKey and apiKeySecretRef are mutually exclusive.
# The referenced secret must provide the token in .data["API_KEY"].
apiKeySecretRef: ""

# -- Interval in seconds to flush query metrics. Must be greater than 0.
queryMetricsFlushIntervalSeconds: 5
# -- Maximum query metric requests in flight at once. The dial for metric throughput
queryMetricsMaxConcurrentRequests: 4
# -- Maximum query metrics queued before new ones are dropped
queryMetricsBufferSize: 50000
# -- Interval in seconds to flush operational metrics. Must be greater than 0.
operationalMetricsFlushIntervalSeconds: 15

# organizationID -- ID of the organization.
organizationID: ""

# proxyID -- ID of this proxy instance.
proxyID: ""

# protocol -- Database protocol.
protocol: "PostgreSQL"

# endpoints -- Upstream database endpoints. Each entry needs `address` (host:port) and `readonly` (bool).
endpoints: []

ports:
  # -- Listening port for read-write connections.
  readWrite: 6141
  # -- Listening port for read-only connections.
  readOnly: 6142
  # -- Prometheus metrics port.
  metrics: 9090
  # -- Cluster peer communication port.
  cluster: 9050

cache:
  # -- Default TTL for cached results in seconds.
  defaultTTLSecs: 300

cluster:
  # -- Enable distributed cache cluster mode.
  enabled: true
  # -- Refresh interval of DNS for peer discovery in seconds.
  refresh_interval_seconds: 10

# -- Application log level. Supports "trace", "debug", "info", "warn", "error"
logLevel: "info"

# -- Worker threads for each proxy listener that serves traffic. Leave empty to derive
# from resources.cpu, rounded up (minimum 1). Set explicitly only to override that.
# Background services are fixed at one thread each and are unaffected.
serverThreads: ""

service:
  # -- Traffic distribution policy for the service. Set to "PreferClose" to reduce inter-zone traffic.
  # Requires Kubernetes 1.31+.
  trafficDistribution: "PreferClose"

# commonLabels -- Labels to add to all resources.
commonLabels: {}

# commonAnnotations -- Annotations to add to all resources.
commonAnnotations: {}

# -- Extra labels to add to the pod.
podLabels: {}

# -- Extra annotations to add to the pod.
podAnnotations: {}

resources:
  cpu: "2"
  memoryRequest: "2Gi"
  memoryLimit: "2Gi"

image:
  repository: us-docker.pkg.dev/castai-hub/library/db-proxy
  pullPolicy: IfNotPresent
  # -- Overrides the image tag. Defaults to Chart.appVersion.
  tag: ""

# -- The name of the service account to be used by the pod.
serviceAccountName: ""

# -- Pod toleration rules.
tolerations: {}

# -- Pod node selector rules.
nodeSelector: {}

# -- Pod affinity rules.
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - APP_NAME
            - key: app.kubernetes.io/component
              operator: In
              values:
                - proxy
        topologyKey: kubernetes.io/hostname

  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/os
              operator: NotIn
              values:
                - windows
            - key: kubernetes.io/arch
              operator: In
              values:
                - amd64
                - arm64
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: provisioner.cast.ai/managed-by
              operator: In
              values:
                - cast.ai

# -- Pod topology spread constraints.
topologySpreadConstraints: []

# -- Pod DNS policy.
dnsPolicy: ""

# -- Pod DNS configuration.
dnsConfig: {}

# -- Connection draining configuration
connection_draining:
  # -- How long existing connections have to finish after SIGTERM. Must be > 0
  grace_period_seconds: 55
  # -- How long the server waits for runtimes to shut down after the grace period. Must be > 0
  graceful_shutdown_timeout_seconds: 5

tls:
  # -- Name of a TLS secret (tls.crt/tls.key) to override the built-in self-signed cert.
  secretName: ""

# -- TCP keepalive for client and database connections. Probing is the only way to tell a
# connection whose far end vanished *without closing* (an evicted pod, a lost node, a killed
# database instance etc.) from one that is merely idle. Without it the proxy would wait on a read that
# will never complete, holding the connection and the database session behind it until the pod
# restarts.
keepalive:
  # -- How long a connection may sit idle before the first probe.
  idle_seconds: 60
  # -- Gap between probes once they start.
  interval_seconds: 10
  # -- Unanswered probes before the connection is dropped.
  count: 3

pooling:
  # -- Deploy the pooling config manager.
  enabled: false
  # -- Number of pooler replicas.
  replicas: 2
  # -- Pre-configured database names.
  databases:
    - postgres
  #-- Configuration for the pooling configuration manager.
  configManager:
    # -- gRPC listen port for the config manager.
    port: 50051
    # -- Peer discovery settings.
    discovery:
      # -- Refresh interval of DNS for peer discovery in seconds.
      refresh_interval_seconds: 10
    # -- Frequency in which pooling metrics are reported in seconds.
    report_metrics_frequency_seconds: 15
    image:
      repository: us-docker.pkg.dev/castai-hub/library/db-pooling
      pullPolicy: IfNotPresent
      tag: ""
    resources:
      cpu: "10m"
      memoryRequest: "32Mi"
      memoryLimit: "32Mi"
  # -- Pooler listen port. Proxy connects to the pooler on this port.
  port: 5432
  # -- Pooler metrics port.
  metricsPort: 9090
  # -- Configure the PgDog section to deploy PgDog as the pooler.
  # Mutually exclusive with proxysql.
  pgdog:
    # -- Enable PgDog as the pooler.
    enabled: false
    #-- Log level for PgDog.
    logLevel: warn
    admin:
      name: pgdog_admin
      user: admin
      password: admin
    image:
      repository: ghcr.io/pgdogdev/pgdog
      pullPolicy: IfNotPresent
      tag: ""
    resources:
      cpu: "1"
      memoryRequest: "1Gi"
      memoryLimit: "1Gi"
    # -- PgDog [general] config overrides. Merged on top of template defaults
    # (health checks, timeouts, passthrough_auth, log settings). Any key-value
    # pair added here will be rendered into pgdog.toml.
    # See https://docs.pgdog.dev/configuration/pgdog.toml/general/
    config: {}
  # -- Configure the ProxySQL section to deploy ProxySQL as the pooler (MySQL only).
  # Mutually exclusive with pgdog. Requires protocol: "MySQL".
  proxySql:
    # -- Enable ProxySQL pooler sidecar (MySQL only)
    enabled: false
    admin:
      user: admin
      password: admin
    image:
      repository: docker.io/proxysql/proxysql
      pullPolicy: IfNotPresent
      tag: ""
    resources:
      cpu: "500m"
      memoryRequest: "256Mi"
      memoryLimit: "256Mi"
    # -- Single ProxySQL upstream DB user (plain string). Mutually exclusive with users/usersSecretRef.
    user: ""
    # -- Single ProxySQL upstream DB password (plain string). Mutually exclusive with users/usersSecretRef.
    password: ""
    # -- Multiple ProxySQL upstream DB users (inline list). Mutually exclusive with user/usersSecretRef.
    # Example: [{username: "u1", password: "p1"}, {username: "u2", password: "p2"}]
    users: []
    # -- Reference to existing secret containing a users.toml key with TOML [[users]] entries.
    # Mutually exclusive with user/users.
    usersSecretRef: ""
    config:
      # -- Number of ProxySQL threads
      threads: 4
      # -- Maximum client connections ProxySQL accepts
      max_connections: 2048
      # -- Maximum connections per backend server
      max_backend_connections: 100
      # -- Percentage of free connections to keep in pool
      free_connections_pct: 5
      # -- Enable connection multiplexing
      multiplexing: true
      # -- Backend connection timeout in milliseconds
      connect_timeout_server: 5000
      # -- Default query timeout in milliseconds
      default_query_timeout: 36000000
      # -- Delay multiplexing for N queries after auto-increment INSERT
      auto_increment_delay_multiplex: 5
      # -- Stacksize for ProxySQL threads
      stacksize: 1048576
      # -- Enable have_compress
      have_compress: true
    # -- ProxySQL image configuration (separate from pooling.configManager image).
    # The db-pooling image is reused for the proxysql-users-init init container.

