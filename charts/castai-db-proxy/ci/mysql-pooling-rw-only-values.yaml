# MySQL with ProxySQL pooling and no read-only endpoint listed.
# Expect: no read-only available address and no -ro service; the read-write
# available address is still advertised on the MySQL default port 3306.
apiKey: "ci-test-token"
organizationID: "11111111-1111-1111-1111-111111111111"
proxyID: "ci-test-proxy"
protocol: "MySQL"
endpoints:
  - address: "mysql-primary.db:3306"
    readonly: false
pooling:
  enabled: true
  proxySql:
    userSecretRef: "mysql-credentials"
