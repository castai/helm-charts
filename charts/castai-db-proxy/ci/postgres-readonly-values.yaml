# PostgreSQL, no pooling, read-write + read-only upstream endpoints.
# Expect: read-only available address advertised and the -ro service deployed
# on the PostgreSQL default port 5432.
apiKey: "ci-test-token"
organizationID: "11111111-1111-1111-1111-111111111111"
proxyID: "ci-test-proxy"
protocol: "PostgreSQL"
endpoints:
  - address: "primary.db:5432"
    readonly: false
  - address: "replica.db:5432"
    readonly: true
