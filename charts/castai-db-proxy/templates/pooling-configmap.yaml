{{- if .Values.pooling.enabled }}
{{- $pgdogEnabled := and .Values.pooling.pgdog .Values.pooling.pgdog.enabled -}}
{{- $proxySqlEnabled := and .Values.pooling.proxySql .Values.pooling.proxySql.enabled -}}
{{- if and $pgdogEnabled $proxySqlEnabled }}
{{- fail "pooling.pgdog.enabled and pooling.proxySql.enabled are mutually exclusive; enable only one" }}
{{- end }}
{{- if and $proxySqlEnabled (ne .Values.protocol "MySQL") }}
{{- fail "pooling.proxySql requires protocol: \"MySQL\"" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "castai-db-proxy.name" . }}-pooler-config
  labels:
    {{- include "castai-db-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: pooling
  annotations:
    {{- include "castai-db-proxy.annotations" . | nindent 4 }}
data:
  config.toml: |
    listen_port = {{ .Values.pooling.configManager.port }}

    {{- if $pgdogEnabled }}
    [pooler.pgdog]
    config_file = "/etc/pgdog/pgdog.toml"

    [pooler.pgdog.admin_database]
    url = "postgresql://{{ .Values.pooling.pgdog.admin.user | urlquery }}:{{ .Values.pooling.pgdog.admin.password | urlquery }}@localhost:{{ .Values.pooling.port }}/{{ .Values.pooling.pgdog.admin.name | urlquery }}"
    {{- end }}

    {{- if $proxySqlEnabled }}
    [pooler.proxy_sql]
    metrics_url = "http://localhost:{{ .Values.pooling.metricsPort }}/metrics"
    {{- end }}

    [api]
    url = {{ printf "https://%s" (required "apiURL must be provided" .Values.apiURL) | quote }}
    organization_id = {{ required "organizationID must be provided" .Values.organizationID | quote }}
    proxy_id = {{ required "proxyID must be provided" .Values.proxyID | quote }}
    report_metrics_frequency_seconds = {{ .Values.pooling.configManager.report_metrics_frequency_seconds }}
{{- end }}
