apiVersion: v1
kind: Service
metadata:
  name: {{ include "castai-db-proxy.name" . }}
  labels:
    {{- include "castai-db-proxy.labels" . | nindent 4 }}
  annotations:
    {{- include "castai-db-proxy.annotations" . | nindent 4 }}
spec:
  {{- with .Values.service.trafficDistribution }}
  trafficDistribution: {{ . }}
  {{- end }}
  ports:
    - name: rw
      port: {{ include "castai-db-proxy.servicePort" . }}
      targetPort: rw
      protocol: TCP
    - name: metrics
      port: {{ .Values.ports.metrics }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "castai-db-proxy.proxySelectorLabels" . | nindent 4 }}
{{- if include "castai-db-proxy.readonlyUpstream" . | eq "true" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "castai-db-proxy.readonlyName" . }}
  labels:
    {{- include "castai-db-proxy.labels" . | nindent 4 }}
  annotations:
    {{- include "castai-db-proxy.annotations" . | nindent 4 }}
spec:
  {{- with .Values.service.trafficDistribution }}
  trafficDistribution: {{ . }}
  {{- end }}
  ports:
    - name: ro
      port: {{ include "castai-db-proxy.servicePort" . }}
      targetPort: ro
      protocol: TCP
  selector:
    {{- include "castai-db-proxy.proxySelectorLabels" . | nindent 4 }}
{{- end }}
{{- if include "castai-db-proxy.directConnect" . | eq "true" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "castai-db-proxy.directName" . }}
  labels:
    {{- include "castai-db-proxy.labels" . | nindent 4 }}
  annotations:
    {{- include "castai-db-proxy.annotations" . | nindent 4 }}
spec:
  {{- with .Values.service.trafficDistribution }}
  trafficDistribution: {{ . }}
  {{- end }}
  ports:
    - name: direct-rw
      port: {{ include "castai-db-proxy.servicePort" . }}
      targetPort: direct-rw
      protocol: TCP
  selector:
    {{- include "castai-db-proxy.proxySelectorLabels" . | nindent 4 }}
{{- if include "castai-db-proxy.hasReadonlyEndpoint" . | eq "true" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "castai-db-proxy.directReadonlyName" . }}
  labels:
    {{- include "castai-db-proxy.labels" . | nindent 4 }}
  annotations:
    {{- include "castai-db-proxy.annotations" . | nindent 4 }}
spec:
  {{- with .Values.service.trafficDistribution }}
  trafficDistribution: {{ . }}
  {{- end }}
  ports:
    - name: direct-ro
      port: {{ include "castai-db-proxy.servicePort" . }}
      targetPort: direct-ro
      protocol: TCP
  selector:
    {{- include "castai-db-proxy.proxySelectorLabels" . | nindent 4 }}
{{- end }}
{{- end }}
