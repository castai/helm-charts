{{- if .Values.pooling.enabled }}
{{- $pgdogEnabled := and .Values.pooling.pgdog  (eq .Values.protocol "PostgreSQL") -}}
{{- $proxySqlEnabled := and .Values.pooling.proxySql (eq .Values.protocol "MySQL") -}}
{{- $appName := include "castai-db-proxy.name" . -}}
{{- if and $proxySqlEnabled (not (or .Values.pooling.proxySql.usersSecretRef .Values.pooling.proxySql.userSecretRef)) }}
{{- fail "pooling.proxySql.usersSecretRef must be provided" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "castai-db-proxy.name" . }}-pooler
  labels:
    {{- include "castai-db-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: pooling
  annotations:
    {{- include "castai-db-proxy.annotations" . | nindent 4 }}
spec:
  replicas: {{ .Values.pooling.replicas }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.pooling.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.pooling.rollingUpdate.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "castai-db-proxy.poolingSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/pooling-configmap.yaml") . | sha256sum }}
        {{- if $pgdogEnabled }}
        checksum/pgdog-config: {{ include (print $.Template.BasePath "/pgdog-config.yaml") . | sha256sum }}
        {{- end }}
        {{- if $proxySqlEnabled }}
        checksum/proxysql-config: {{ include (print $.Template.BasePath "/proxysql-config.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.pooling.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "castai-db-proxy.poolingSelectorLabels" . | nindent 8 }}
        {{- with .Values.pooling.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.priorityClass.name }}
      priorityClassName: {{ . }}
      {{- end }}
      # 60s pgdog shutdown_timeout + 5s margin, plus the preStop sleep above.
      terminationGracePeriodSeconds: {{ add .Values.connection_draining.pre_stop_sleep_seconds 65 }}
      {{- with .Values.pooling.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | replace "APP_NAME" $appName | nindent 8 }}
      {{- end }}
      {{- with .Values.pooling.affinity }}
      affinity:
        {{- toYaml . | replace "APP_NAME" $appName | nindent 8 }}
      {{- end }}
      volumes:
        - name: pooling-config
          configMap:
            name: {{ include "castai-db-proxy.name" . }}-pooler-config
        {{- if $pgdogEnabled }}
        - name: pgdog-config-template
          configMap:
            name: {{ include "castai-db-proxy.name" . }}-pgdog-config
        - name: pgdog-config
          emptyDir: {}
        {{- end }}
        {{- if $proxySqlEnabled }}
        - name: proxysql-data
          emptyDir: {}
        - name: proxysql-config-template
          configMap:
            name: {{ include "castai-db-proxy.name" . }}-proxysql-config
        - name: proxysql-config-output
          emptyDir: {}
        {{- with .Values.pooling.proxySql.usersSecretRef }}
        - name: proxysql-users
          secret:
            secretName: {{ . | quote }}
        {{- end }}
        {{- end }}
      {{- if or $pgdogEnabled $proxySqlEnabled }}
      initContainers:
        {{- if $pgdogEnabled }}
        - name: pgdog-init
          image: "{{ .Values.pooling.pgdog.image.repository }}:{{ include "castai-db-proxy.pgdogImage" . }}"
          command: ["sh", "-c", "cp /etc/pgdog-static/pgdog.toml /etc/pgdog/pgdog.toml"]
          volumeMounts:
            - name: pgdog-config-template
              mountPath: /etc/pgdog-static
              readOnly: true
            - name: pgdog-config
              mountPath: /etc/pgdog
          securityContext:
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
        {{- end }}
        {{- if $proxySqlEnabled }}
        - name: proxysql-init
          image: "{{ .Values.pooling.proxySql.image.repository }}:{{ include "castai-db-proxy.proxySqlImage" . }}"
          imagePullPolicy: {{ .Values.pooling.proxySql.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              cp /etc/proxysql-template/proxysql.cnf /etc/proxysql/proxysql.cnf
              chmod 600 /etc/proxysql/proxysql.cnf
          volumeMounts:
            - name: proxysql-config-template
              mountPath: /etc/proxysql-template
              readOnly: true
            - name: proxysql-config-output
              mountPath: /etc/proxysql
          securityContext:
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 999
        - name: proxysql-users-init
          image: "{{ .Values.pooling.proxySql.image.repository }}:{{ include "castai-db-proxy.proxySqlImage" . }}"
          imagePullPolicy: {{ .Values.pooling.proxySql.image.pullPolicy }}
          env:
            {{- with .Values.pooling.proxySql.usersSecretRef }}
            - name: USERS_FILE
              value: /etc/proxysql-users/users.json
            - name: USERS_SECRET
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.pooling.proxySql.userSecretRef }}
            - name: LEGACY_SECRET
              value: {{ . | quote }}
            - name: LEGACY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: DATABASE_USERNAME
            - name: LEGACY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: DATABASE_PASSWORD
            {{- end }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              CNF_FILE="/etc/proxysql/proxysql.cnf"

              entries=$(perl -MJSON::PP -e '
                use strict;
                use warnings;

                sub fail { die "proxysql-users-init: @_\n" }

                sub escape {
                  my $v = shift;
                  $v =~ s/\\/\\\\/g;
                  $v =~ s/"/\\"/g;
                  $v =~ s/\x27/\x27\x27/g;
                  return $v;
                }

                my (@entries, %seen);
                sub add_user {
                  my ($user, $pass, $source) = @_;
                  fail("empty username in $source") if $user eq "";
                  fail("username \"$user\" in $source contains a control character")
                    if $user =~ /[\x00-\x1f\x7f]/;
                  fail("password of \"$user\" in $source contains a control character")
                    if $pass =~ /[\x00-\x1f\x7f]/;
                  if (exists $seen{$user}) {
                    fail("username \"$user\" is listed more than once in $source") if $seen{$user} eq $source;
                    fail("username \"$user\" is defined in both $seen{$user} and $source");
                  }
                  $seen{$user} = $source;
                  push @entries, sprintf(
                    "  { username=\"%s\" , password=\"%s\" , default_hostgroup=0 , active=1 }",
                    escape($user), escape($pass));
                }

                if (defined $ENV{USERS_FILE}) {
                  my $src = "users.json of Secret $ENV{USERS_SECRET}";
                  open(my $fh, "<:raw", $ENV{USERS_FILE})
                    or fail("Secret $ENV{USERS_SECRET} has no users.json key");
                  my $raw = do { local $/; <$fh> };
                  my $users = eval { JSON::PP->new->utf8->decode($raw) };
                  unless (defined $users) {
                    (my $err = $@) =~ s/ at -e line \d+\.\s*$//;
                    fail("$src is not valid JSON: $err");
                  }
                  fail("$src must be a JSON array of {\"username\": ..., \"password\": ...} objects")
                    unless ref $users eq "ARRAY";
                  fail("$src lists no users") unless @$users;
                  for my $i (0 .. $#$users) {
                    my $u = $users->[$i];
                    fail("entry $i of $src must be an object with username and password")
                      unless ref $u eq "HASH";
                    for my $key (sort keys %$u) {
                      fail("entry $i of $src has unknown field \"$key\" (expected username and password)")
                        unless $key eq "username" || $key eq "password";
                    }
                    for my $key ("username", "password") {
                      fail("entry $i of $src is missing \"$key\"") unless defined $u->{$key};
                      fail("\"$key\" of entry $i of $src must be a string") if ref $u->{$key};
                    }
                    my ($user, $pass) = ($u->{username}, $u->{password});
                    utf8::encode($user);
                    utf8::encode($pass);
                    add_user($user, $pass, $src);
                  }
                }

                if (defined $ENV{LEGACY_SECRET}) {
                  add_user($ENV{LEGACY_USERNAME}, $ENV{LEGACY_PASSWORD},
                    "Secret $ENV{LEGACY_SECRET} (userSecretRef)");
                }

                print join(",\n", @entries);
              ')

              printf '\nmysql_users=\n(\n%s\n)\n' "$entries" >> "$CNF_FILE"
          volumeMounts:
            - name: proxysql-config-output
              mountPath: /etc/proxysql
              readOnly: false
            {{- if .Values.pooling.proxySql.usersSecretRef }}
            - name: proxysql-users
              mountPath: /etc/proxysql-users
              readOnly: true
            {{- end }}
          securityContext:
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 999
        {{- end }}
      {{- end }}
      containers:
        - name: config-manager
          image: "{{ .Values.pooling.configManager.image.repository }}:{{ include "castai-db-proxy.poolingConfigManagerImage" . }}"
          imagePullPolicy: {{ .Values.pooling.configManager.image.pullPolicy }}
          args:
            - --config
            - /etc/roxy-pooling/config.toml
          securityContext:
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          ports:
            - name: grpc
              containerPort: {{ .Values.pooling.configManager.port }}
              protocol: TCP
          readinessProbe:
            grpc:
              port: {{ .Values.pooling.configManager.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: {{ .Values.pooling.configManager.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          envFrom:
            - secretRef:
              {{- if .Values.apiKey }}
                name: {{ include "castai-db-proxy.name" . }}
              {{- else }}
                name: {{ required "apiKey or apiKeySecretRef must be provided" .Values.apiKeySecretRef }}
              {{- end }}
          env:
            - name: NODE_LABEL
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: pooling-config
              mountPath: /etc/roxy-pooling
              readOnly: true
            {{- if $pgdogEnabled }}
            - name: pgdog-config
              mountPath: /etc/pgdog
            {{- end }}
            {{- if $proxySqlEnabled }}
            - name: proxysql-config-output
              mountPath: /etc/proxysql
              readOnly: true
            {{- end }}
          resources:
            requests:
              cpu: {{ .Values.pooling.configManager.resources.cpu }}
              memory: {{ .Values.pooling.configManager.resources.memoryRequest }}
            limits:
              memory: {{ .Values.pooling.configManager.resources.memoryLimit }}
        {{- if $pgdogEnabled }}
        - name: pgdog
          image: "{{ .Values.pooling.pgdog.image.repository }}:{{ include "castai-db-proxy.pgdogImage" . }}"
          imagePullPolicy: {{ .Values.pooling.pgdog.image.pullPolicy }}
          command: ["/usr/local/bin/pgdog"]
          args:
            - --config
            - /etc/pgdog/pgdog.toml
          env:
            - name: RUST_LOG
              value: {{ .Values.pooling.pgdog.logLevel }}
          {{- if gt (int .Values.connection_draining.pre_stop_sleep_seconds) 0 }}
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep {{ .Values.connection_draining.pre_stop_sleep_seconds | quote }}
          {{- end }}
          securityContext:
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          ports:
            - name: upstream
              containerPort: {{ .Values.pooling.pgdog.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.pooling.metricsPort }}
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: upstream
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: upstream
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: pgdog-config
              mountPath: /etc/pgdog
              readOnly: true
          resources:
            requests:
              cpu: {{ .Values.pooling.pgdog.resources.cpu }}
              memory: {{ .Values.pooling.pgdog.resources.memoryRequest }}
            limits:
              memory: {{ .Values.pooling.pgdog.resources.memoryLimit }}
        {{- end }}
        {{- if $proxySqlEnabled }}
        - name: proxysql
          image: "{{ .Values.pooling.proxySql.image.repository }}:{{ include "castai-db-proxy.proxySqlImage" . }}"
          imagePullPolicy: {{ .Values.pooling.proxySql.image.pullPolicy }}
          command:
            - proxysql
          args:
            - --config
            - /etc/proxysql/proxysql.cnf
            - --datadir
            - /var/lib/proxysql
            - --reload
            - --prometheus
            - -f
          {{- if gt (int .Values.connection_draining.pre_stop_sleep_seconds) 0 }}
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep {{ .Values.connection_draining.pre_stop_sleep_seconds | quote }}
          {{- end }}
          securityContext:
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 999
          ports:
            - name: admin
              containerPort: 6032
              protocol: TCP
            - name: upstream-rw
              containerPort: {{ .Values.pooling.proxySql.ports.readWrite }}
              protocol: TCP
            - name: upstream-ro
              containerPort: {{ .Values.pooling.proxySql.ports.readOnly }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.pooling.metricsPort }}
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: upstream-rw
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /metrics
              port: {{ .Values.pooling.metricsPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: {{ .Values.pooling.metricsPort }}
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: proxysql-data
              mountPath: /var/lib/proxysql
            - name: proxysql-config-output
              mountPath: /etc/proxysql
              readOnly: true
          resources:
            requests:
              cpu: {{ .Values.pooling.proxySql.resources.cpu }}
              memory: {{ .Values.pooling.proxySql.resources.memoryRequest }}
            limits:
              memory: {{ .Values.pooling.proxySql.resources.memoryLimit }}
        {{- end }}
{{- end }}