apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "castai-db-proxy.name" . }}-config
  labels:
    {{- include "castai-db-proxy.labels" . | nindent 4 }}
  annotations:
    {{- include "castai-db-proxy.annotations" . | nindent 4 }}
data:
  config.toml: |
    protocol = {{ .Values.protocol | quote }}
    databases_resolver = "api"

    [environment.k8s]

    [ports]
    read_write = {{ .Values.ports.readWrite }}
    readonly = {{ .Values.ports.readOnly }}
    metrics = {{ .Values.ports.metrics }}

    {{- if not .Values.endpoints }}{{ fail "endpoints must contain at least one endpoint" }}{{ end }}
    {{- range .Values.endpoints }}

    [[endpoints]]
    address = {{ .address | quote }}
    readonly = {{ .readonly }}
    {{- end }}

    [api]
    url = {{ printf "https://%s" (required "apiURL must be provided" .Values.apiURL) | quote }}
    organization_id = {{ required "organizationID must be provided" .Values.organizationID | quote }}
    proxy_id = {{ required "proxyID must be provided" .Values.proxyID | quote }}

    [cache]
    default_ttl_secs = {{ .Values.cache.defaultTTLSecs }}
    {{- if .Values.cluster.enabled }}

    [cluster]
    listen_port = {{ .Values.ports.cluster }}

    [cluster.discovery]
    type = "dns"
    resolver_address = "headless-{{ include "castai-db-proxy.name" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.ports.cluster }}"
    refresh_interval_seconds = {{ .Values.cluster.refresh_interval_seconds }}
    {{- end }}

    [server]
    grace_period_seconds = {{ .Values.connection_draining.grace_period_seconds }}
    graceful_shutdown_timeout_seconds = {{ .Values.connection_draining.graceful_shutdown_timeout_seconds }}

    [tls]
    cert = "/etc/tls/tls.crt"
    key = "/etc/tls/tls.key"
    {{- if .Values.pooling.enabled }}

    [pooling]
    pooler_url = "{{ include "castai-db-proxy.name" . }}-pooler.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.pooling.port }}"

    [pooling.config_manager]
    protocol = "http"

    [pooling.config_manager.discovery]
    type = "dns"
    resolver_address = "headless-{{ include "castai-db-proxy.name" . }}-pooler.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.pooling.configManager.port }}"
    refresh_interval_seconds = {{ .Values.pooling.configManager.discovery.refresh_interval_seconds }}
    {{- end }}
