{{- if .Values.pooling.enabled }}
{{- $proxySqlEnabled := and .Values.pooling.enabled (eq .Values.protocol "MySQL") -}}
{{- $pgdogEnabled := and .Values.pooling.enabled (eq .Values.protocol "PostgreSQL") -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "castai-db-proxy.name" . }}-pooler
  labels:
    {{- include "castai-db-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: pooling
  annotations:
    {{- include "castai-db-proxy.annotations" . | nindent 4 }}
spec:
  ports:
    {{- if $pgdogEnabled }}
    - name: upstream
      port: {{ .Values.pooling.pgdog.port }}
      targetPort: upstream
      protocol: TCP
    {{- end }}

    {{- if $proxySqlEnabled }}
    - name: upstream-rw
      port: {{ .Values.pooling.proxySql.ports.readWrite }}
      targetPort: upstream-rw
      protocol: TCP

    - name: upstream-ro
      port: {{ .Values.pooling.proxySql.ports.readOnly }}
      targetPort: upstream-ro
      protocol: TCP
    {{- end }}

    - name: metrics
      port: {{ .Values.pooling.metricsPort }}
      targetPort: metrics
      protocol: TCP
  trafficDistribution: PreferClose
  selector:
    {{- include "castai-db-proxy.poolingSelectorLabels" . | nindent 4 }}

---

apiVersion: v1
kind: Service
metadata:
  name: headless-{{ include "castai-db-proxy.name" . }}-pooler
  labels:
    {{- include "castai-db-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: pooling
  annotations:
    {{- include "castai-db-proxy.annotations" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: grpc
      port: {{ .Values.pooling.configManager.port }}
      targetPort: grpc
      protocol: TCP
  selector:
    {{- include "castai-db-proxy.poolingSelectorLabels" . | nindent 4 }}
{{- end }}
