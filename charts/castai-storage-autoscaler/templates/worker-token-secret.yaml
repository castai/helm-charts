{{- if and .Values.migration.enabled .Values.migration.workerAuth.enabled .Values.migration.workerAuth.token }}
{{- /* Only the inline-token path renders a chart-managed Secret;
      tokenSecretRef deployments bring their own Secret (see values.yaml). */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "castai-storage-autoscaler.fullname" . }}-migration-worker-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "castai-storage-autoscaler.labels" . | nindent 4 }}
type: Opaque
data:
  worker-token: {{ .Values.migration.workerAuth.token | b64enc }}
{{- end }}
