{{- if and .Values.controller.enabled .Values.serviceMonitor .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "castai-storage-autoscaler.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "castai-storage-autoscaler.labels" . | nindent 4 }}
    {{- with (.Values.serviceMonitor).additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "castai-storage-autoscaler.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      interval: {{ (.Values.serviceMonitor).interval | default "30s" }}
      scrapeTimeout: {{ (.Values.serviceMonitor).scrapeTimeout | default "10s" }}
{{- end }}
