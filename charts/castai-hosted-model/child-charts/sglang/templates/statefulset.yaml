{{- /*
Multi-node path ONLY (multiNode.enabled=true). One serving engine spans
multiNode.nnodes pods (one per node, each claiming its full GPU count) joined by
torch/NCCL into a single tensor-parallel engine. Requires the headless Service
(statefulset-headless-service.yaml) for stable rank DNS.

  - replicas          = multiNode.nnodes            (rank count, NOT model copies)
  - --node-rank       = pod ordinal (…-0 -> 0, …-1 -> 1, …)
  - --dist-init-addr  = <rank-0 FQDN>:<distInitPort> (leader rendezvous)
  - --nnodes          = multiNode.nnodes
  - --tp-size         = tensorParallelSize (should equal nnodes * gpusPerNode)

Only rank 0 serves HTTP; the router (router.enabled) discovers rank 0 only via
router.serviceDiscovery.extraSelector (see values). Everything except kind,
serviceName, the command wrapper, and the dist flags mirrors deployment.yaml so
the two paths stay behaviourally identical per-pod.
*/}}
{{- if .Values.multiNode.enabled }}
{{- include "sglang.multiNode.validate" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "sglang.fullname" . }}
  labels:
    model.aibrix.ai/port: {{ .Values.container.port | quote }}
    {{- include "sglang.labels" . | nindent 4 }}
    {{- with .Values.deployment.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    workloads.cast.ai/configuration: |
      vertical:
        optimization: off
      horizontal:
        optimization: off
spec:
  serviceName: {{ include "sglang.headlessName" . }}
  replicas: {{ .Values.multiNode.nnodes }}
  podManagementPolicy: Parallel      # bring all ranks up together; workers wait on rank-0 DNS
  updateStrategy:
    type: {{ .Values.multiNode.updateStrategy | default "OnDelete" }}
  selector:
    matchLabels:
      {{- include "sglang.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "sglang.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      volumes:
        {{- if .Values.tensorParallelSize }}
        # SGLang needs access to the host's shared memory for tensor parallel inference.
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.shm.sizeLimit | quote }}
        {{- end }}
        {{- if .Values.persistence.hostPath.enabled }}
        # Model weights are saved to host storage so they survive pod restarts on the same node.
        - name: models
          hostPath:
            path: {{ required "persistence.hostPath.path must be set when persistence.hostPath.enabled is true" .Values.persistence.hostPath.path }}/models
            type: {{ .Values.persistence.hostPath.type }}
        {{- else }}
        - name: models
          emptyDir: {}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: "sglang"
          image: "{{ required "Required value 'image.repository' must be defined" .Values.image.repository }}:{{ required "Required value 'image.tag' must be defined" .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          {{- /* node-rank is derived from the StatefulSet pod ordinal via HOSTNAME.
             bash (NOT /bin/sh) because the wrapper uses `set -o pipefail`. */}}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              ORDINAL="${HOSTNAME##*-}"
              LEADER="{{ include "sglang.leaderFqdn" . }}"
              echo "[entrypoint] HOSTNAME=$HOSTNAME node-rank=$ORDINAL leader=$LEADER"
              # With podManagementPolicy: Parallel the workers (rank>0) can start
              # before rank-0 has a DNS record, so torch/NCCL dist-init would fail
              # immediately. Block until the leader FQDN resolves before launching.
              if [ "${ORDINAL}" != "0" ]; then
                echo "[entrypoint] rank ${ORDINAL} waiting for leader DNS ${LEADER} ..."
                until getent hosts "${LEADER}" >/dev/null 2>&1; do sleep 2; done
                echo "[entrypoint] leader ${LEADER} resolved; starting."
              fi
              exec python3 -m sglang.launch_server \
                --model-path={{ required "Required value 'model.name' must be defined" .Values.model.name }} \
                --served-model-name={{ .Values.model.servedName | default .Values.model.name }} \
                --host=0.0.0.0 \
                --port={{ .Values.container.port }} \
                --download-dir=/models \
                --dist-init-addr="${LEADER}:{{ .Values.multiNode.distInitPort }}" \
                --nnodes={{ .Values.multiNode.nnodes }} \
                --node-rank="${ORDINAL}" \
                {{- if .Values.tensorParallelSize }}
                --tp-size={{ .Values.tensorParallelSize }} \
                {{- end }}
                {{- range .Values.extraArgs }}
                {{ . }} \
                {{- end }}
                ;
          env:
            - name: HF_HOME # Co-locate the HuggingFace cache with the download dir
              value: /models
            {{- if .Values.ldLibraryPath }}
            - name: LD_LIBRARY_PATH
              value: {{ .Values.ldLibraryPath | quote }}
            {{- end }}
            {{- if .Values.model.hfToken }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "sglang.hfSecretName" . }}
                  key: "hfToken"
                  optional: true
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.container.port }}
              protocol: TCP
            - name: dist
              containerPort: {{ .Values.multiNode.distInitPort }}
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- /* Probes hit /health, which only rank-0 serves. Worker ranks (>0)
             have no HTTP server, so HTTP probes would fail-loop and restart them.
             Emit probes ONLY when multiNode.probeAllRanks=true (rare); by default
             workers rely on the process staying alive + NCCL liveness. */}}
          {{- if .Values.multiNode.probeAllRanks }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.startupProbe.httpGet.path }}
              port: http
            initialDelaySeconds: {{ .Values.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
            successThreshold: {{ .Values.startupProbe.successThreshold }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.httpGet.path }}
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            successThreshold: {{ .Values.livenessProbe.successThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.httpGet.path }}
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            successThreshold: {{ .Values.readinessProbe.successThreshold }}
          {{- end }}
          {{- else }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "pgrep -f 'sglang.launch_server' >/dev/null"]
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            successThreshold: {{ .Values.livenessProbe.successThreshold }}
          {{- end }}
          {{- if and .Values.startupProbe.enabled (eq (int .Values.multiNode.nnodes) 1) }}
          startupProbe:
            httpGet:
              path: {{ .Values.startupProbe.httpGet.path }}
              port: http
            initialDelaySeconds: {{ .Values.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
            successThreshold: {{ .Values.startupProbe.successThreshold }}
          {{- end }}
          {{- end }}
          volumeMounts:
          {{- if .Values.tensorParallelSize }}
            - name: shm
              mountPath: /dev/shm
          {{- end }}
            - name: models
              mountPath: /models
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* Affinity for multi-node. The one-rank-per-node hostname podAntiAffinity
         is MANDATORY (each rank claims a full GPU node) and is always injected.
         User-supplied affinity is preserved and MERGED, not dropped:
           - nodeAffinity / podAffinity: passed through verbatim.
           - podAntiAffinity: the mandatory hostname rule is PREPENDED to the
             user's own required rules; user preferred rules pass through too.
         This lets operators add extra scheduling constraints without losing the
         invariant that ranks never co-locate. */}}
      {{- $userAff := .Values.affinity | default dict }}
      {{- $userPAA := $userAff.podAntiAffinity | default dict }}
      {{- $hostnameRule := list (dict "labelSelector" (dict "matchLabels" (dict "app.kubernetes.io/name" (include "sglang.fullname" .) "app.kubernetes.io/instance" .Release.Name)) "topologyKey" "kubernetes.io/hostname") }}
      {{- $requiredPAA := concat $hostnameRule ($userPAA.requiredDuringSchedulingIgnoredDuringExecution | default list) }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            {{- toYaml $requiredPAA | nindent 12 }}
          {{- with $userPAA.preferredDuringSchedulingIgnoredDuringExecution }}
          preferredDuringSchedulingIgnoredDuringExecution:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- if $userAff.nodeAffinity }}
        nodeAffinity:
          {{- toYaml $userAff.nodeAffinity | nindent 10 }}
        {{- end }}
        {{- if $userAff.podAffinity }}
        podAffinity:
          {{- toYaml $userAff.podAffinity | nindent 10 }}
        {{- end }}
{{- end }}
