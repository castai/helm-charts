# yaml-language-server: $schema=https://raw.githubusercontent.com/octo-sts/app/refs/heads/main/pkg/octosts/octosts.TrustPolicy.json
#
# octo-sts trust policy "ai-enabler-publish": lets build-proxy.yaml and build-batch-processor.yaml
# of github.com/castai/ai-enabler, on tag refs only (published releases), start publish-chart.yml
# and follow its run (actions: write). The chart itself is verified by publish-chart.yml against
# .github/chart-signers.yaml (source: ai-enabler).
#
# octo-sts reads this file from the default branch only. Changing it changes who may start
# workflows in this repository, so it goes through review like the workflows do.
issuer: https://token.actions.githubusercontent.com
subject_pattern: 'repo:castai(@44625431)?/ai-enabler(@750775486)?:ref:refs/tags/.*'
claim_pattern:
  repository: castai/ai-enabler
  repository_id: "750775486"
  job_workflow_ref: castai/ai-enabler/\.github/workflows/build-(proxy|batch-processor)\.yaml@refs/tags/.*
permissions:
  actions: write
