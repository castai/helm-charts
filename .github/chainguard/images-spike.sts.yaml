# yaml-language-server: $schema=https://raw.githubusercontent.com/octo-sts/app/refs/heads/main/pkg/octosts/octosts.TrustPolicy.json
#
# TEMPORARY (spike, to be removed): octo-sts trust policy "images-spike". Lets the publish
# workflow of github.com/castai/images, on the spike/helm-charts-publish branch only,
# start and watch workflows in this repository (oci-publish-spike.yml). Grants no write
# access to contents.
#
# octo-sts reads this file from the default branch only.
issuer: https://token.actions.githubusercontent.com
subject_pattern: 'repo:castai(@44625431)?/images(@1362548923)?:ref:refs/heads/spike/helm-charts-publish'
claim_pattern:
  repository: castai/images
  repository_id: "1362548923"
  job_workflow_ref: castai/images/\.github/workflows/publish\.yml@refs/heads/spike/helm-charts-publish
permissions:
  actions: write
