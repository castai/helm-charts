# yaml-language-server: $schema=https://raw.githubusercontent.com/octo-sts/app/refs/heads/main/pkg/octosts/octosts.TrustPolicy.json
#
# Lets publish-chart.yml on main create releases and push to gh-pages and main.
# An App token, unlike GITHUB_TOKEN, triggers the umbrella update workflow.
issuer: https://token.actions.githubusercontent.com
subject_pattern: 'repo:castai(@44625431)?/helm-charts(@427274423)?:ref:refs/heads/main'
claim_pattern:
  repository: castai/helm-charts
  repository_id: "427274423"
  job_workflow_ref: castai/helm-charts/\.github/workflows/publish-chart\.yml@refs/heads/main
permissions:
  contents: write
