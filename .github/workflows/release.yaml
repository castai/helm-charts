# Releases the charts built in this repository (sources.helm-charts.charts in .github/chart-signers.yaml):
# on a push to main, package, push to GHCR, sign, then start and await publish-chart.yml.
# See .github/RELEASING.md.
name: Release Charts

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      use_default_token:
        description: 'Use GITHUB_TOKEN instead of the octo-sts token for the umbrella bump (no downstream workflows will be triggered)'
        type: boolean
        default: false

env:
  GHCR_CHART_REGISTRY: ghcr.io/castai/helm-charts

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io/castai/helm-charts/<chart>
      id-token: write # keyless cosign signature
      actions: write # start publish-chart.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@v4.3.1
        with:
          version: v3.17.0

      - name: Install oras and cosign
        run: |
          set -euo pipefail
          ORAS_VERSION=1.3.6
          curl -fsSL "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin oras
          COSIGN_VERSION=3.1.4
          sudo curl -fsSL "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64" \
            -o /usr/local/bin/cosign
          sudo chmod +x /usr/local/bin/cosign

      - name: Find the charts without a release
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          trust=.github/chart-signers.yaml
          mapfile -t allowed < <(yq -r '.sources.helm-charts.charts[]' "${trust}")
          (( ${#allowed[@]} > 0 )) || { echo "::error::sources.helm-charts.charts is empty in ${trust}"; exit 1; }
          released() { gh release view "$1" --json tagName >/dev/null 2>&1; }

          # Only listed charts are built here; the others are copies released elsewhere.
          to_build=()
          for chart_yaml in charts/*/Chart.yaml; do
            dir="$(dirname "${chart_yaml}")"
            name="$(yq -r '.name' "${chart_yaml}")"
            version="$(yq -r '.version' "${chart_yaml}")"
            released "${name}-${version}" && continue
            if printf '%s\n' "${allowed[@]}" | grep -qx "${name}"; then
              to_build+=("${dir}:${name}:${version}")
            else
              echo "::warning::${dir} is at ${name}-${version}, which has no release, but ${name} is not in sources.helm-charts.charts of ${trust}: not built here"
            fi
          done
          if (( ${#to_build[@]} == 0 )); then
            echo "every in-repo chart is released already: nothing to do"
          else
            echo "to build: ${to_build[*]}"
          fi
          echo "charts=${to_build[*]:-}" >> "${GITHUB_OUTPUT}"

      - name: Package, push to GHCR and sign
        if: steps.find.outputs.charts != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TO_BUILD: ${{ steps.find.outputs.charts }}
        run: |
          set -euo pipefail
          trust=.github/chart-signers.yaml
          issuer="$(yq -r '.sources.helm-charts.issuer' "${trust}")"
          identities="$(yq -r '.sources.helm-charts.identities | join("|")' "${trust}")"
          signed() {
            oras discover --format json --artifact-type application/vnd.dev.sigstore.bundle.v0.3+json "$1" \
              | jq -e '.referrers | length > 0' >/dev/null
          }
          verify() {
            cosign verify --certificate-oidc-issuer "${issuer}" \
              --certificate-identity-regexp "(${identities})" "$1" >/dev/null
          }

          # helm dependency build needs the dependency repositories added.
          helm repo add vector https://helm.vector.dev &
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts &
          helm repo add incubator https://charts.helm.sh/incubator &
          helm repo add elasticsearch https://helm.elastic.co &
          helm repo add grafana https://grafana.github.io/helm-charts &
          helm repo add castai-helm https://castai.github.io/helm-charts &
          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/ &
          wait
          helm registry login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin <<< "${GITHUB_TOKEN}"
          oras login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin <<< "${GITHUB_TOKEN}"

          mkdir -p .cr-release-packages
          for entry in ${TO_BUILD}; do
            IFS=':' read -r dir name version <<< "${entry}"
            target="${GHCR_CHART_REGISTRY}/${name}:${version}"
            echo "::group::${name}-${version}"
            # A re-run after a failed publish reuses what is pushed and signed already.
            if digest="$(oras resolve "${target}" 2>/dev/null)" && signed "${GHCR_CHART_REGISTRY}/${name}@${digest}"; then
              echo "${target} exists and is signed: reusing ${digest}"
            else
              # Sub-charts with remote dependencies of their own first (the umbrella's profiles), then the chart.
              for sub in "${dir}"/charts/*/Chart.yaml; do
                [[ -f "${sub}" && "$(yq -r '.dependencies // [] | length' "${sub}")" != "0" ]] || continue
                helm dependency update "$(dirname "${sub}")"
              done
              helm dependency build "${dir}"
              helm package "${dir}" --destination .cr-release-packages
              helm push ".cr-release-packages/${name}-${version}.tgz" "oci://${GHCR_CHART_REGISTRY}"
              digest="$(oras resolve "${target}")"
              # Keyless, by digest: one signature covers every tag at that digest.
              cosign sign --yes "${GHCR_CHART_REGISTRY}/${name}@${digest}"
            fi
            verify "${GHCR_CHART_REGISTRY}/${name}@${digest}"
            echo "signed and verified: ${target}@${digest}"
            echo "::endgroup::"
          done

      # Wait for publish-chart.yml so that the push shows one outcome per chart.
      - name: Publish each chart and wait
        if: steps.find.outputs.charts != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TO_BUILD: ${{ steps.find.outputs.charts }}
        run: |
          set -euo pipefail
          failed=0
          for entry in ${TO_BUILD}; do
            IFS=':' read -r _ name version <<< "${entry}"
            # return_run_details: the API answers with the run id instead of an empty 204.
            run="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/publish-chart.yml/dispatches" \
              -f ref=main \
              -f "inputs[chart]=${name}" \
              -f "inputs[chart_version]=${version}" \
              -f "inputs[source]=helm-charts" \
              -F return_run_details=true)"
            run_id="$(jq -r '.workflow_run_id // ""' <<< "${run}")"
            run_url="$(jq -r '.html_url // ""' <<< "${run}")"
            [[ "${run_id}" =~ ^[0-9]+$ ]] || { echo "::error::dispatch for ${name}-${version} returned no run id: ${run}"; exit 1; }
            echo "${name}-${version}: publish-chart run ${run_url}"

            # Charts of one push are published one after another: they share index.yaml.
            status=0
            timeout 20m gh run watch "${run_id}" --exit-status --interval 10 >/dev/null || status=$?
            conclusion="$(gh run view "${run_id}" --json conclusion --jq .conclusion)"
            {
              echo "## Chart \`${name}:${version}\`"
              echo
              echo "- oci: \`oci://${GHCR_CHART_REGISTRY}/${name}:${version}\`"
              echo "- publish-chart run: ${run_url} (${conclusion:-still running})"
              echo "- release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${name}-${version}"
            } >> "${GITHUB_STEP_SUMMARY}"
            if (( status == 124 )); then
              echo "::error::publish-chart run for ${name}-${version} did not finish in 20 minutes: ${run_url}"
              failed=1
            elif (( status != 0 )); then
              echo "::error::publish-chart run for ${name}-${version} failed (${conclusion}): ${run_url}"
              failed=1
            fi
          done
          exit "${failed}"

  update-umbrella:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Get a token to push the bump
        id: bump_token
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.use_default_token) }}
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: ${{ github.repository }}
          identity: umbrella-bump

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.bump_token.outputs.token || github.token }}

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install yq
        uses: mikefarah/yq@v4.52.4

      - name: Update umbrella subchart dependencies
        id: update
        run: |
          CHANGED=false
          BUMP_SUMMARY=""

          SUBCHART_FILES=(
            "charts/castai-umbrella/charts/kent/Chart.yaml"
            "charts/castai-umbrella/charts/autoscaler/Chart.yaml"
            "charts/castai-umbrella/charts/autoscaler-anywhere/Chart.yaml"
            "charts/castai-umbrella/charts/autoscaler-openshift/Chart.yaml"
          )

          # Find charts whose Chart.yaml version changed in this push
          CHANGED_CHARTS=$(git diff ${{ github.event.before }} ${{ github.sha }} -- 'charts/*/Chart.yaml' | grep '^+++ b/' | sed 's|+++ b/||')

          for CHART_FILE in $CHANGED_CHARTS; do
            CHART_NAME=$(yq ".name" "$CHART_FILE")
            VERSION=$(yq ".version" "$CHART_FILE")
            echo "Detected changed chart: ${CHART_NAME} @ ${VERSION}"

            for SUBCHART_FILE in "${SUBCHART_FILES[@]}"; do
              if yq ".dependencies[].name" "$SUBCHART_FILE" | grep -qx "$CHART_NAME"; then
                CURRENT=$(yq ".dependencies[] | select(.name == \"$CHART_NAME\") | .version" "$SUBCHART_FILE")
                if [ "$CURRENT" != "$VERSION" ]; then
                  echo "Updating ${CHART_NAME} in ${SUBCHART_FILE}: ${CURRENT} -> ${VERSION}"
                  yq -i "(.dependencies[] | select(.name == \"$CHART_NAME\") | .version) = \"${VERSION}\"" "$SUBCHART_FILE"
                  CHANGED=true
                  BUMP_SUMMARY="${BUMP_SUMMARY:+$BUMP_SUMMARY, }${CHART_NAME} to v.${VERSION}"
                fi
              fi
            done
          done

          if [ "$CHANGED" == "false" ]; then
            echo "No umbrella subchart dependencies need updating."
          fi
          echo "changed=${CHANGED}" >> $GITHUB_OUTPUT
          echo "bump_summary=${BUMP_SUMMARY}" >> $GITHUB_OUTPUT

      - name: Bump umbrella chart version
        if: steps.update.outputs.changed == 'true'
        run: |
          CHART_FILE="charts/castai-umbrella/Chart.yaml"
          CURRENT=$(yq ".version" "$CHART_FILE")
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          yq -i ".version = \"${NEW_VERSION}\"" "$CHART_FILE"
          echo "Bumped castai-umbrella version: ${CURRENT} -> ${NEW_VERSION}"

      - name: Commit and push changes
        if: steps.update.outputs.changed == 'true'
        run: |
          git add charts/castai-umbrella/
          git commit -m "[castai-umbrella] bump ${{ steps.update.outputs.bump_summary }}"
          git push
