# Trusted chart signers per source: registry, OIDC issuer, identities. See .github/README.md.
sources:
  # GitLab pipelines (kubecast, clm, pv-monitor).
  gitlab:
    registry: us-central1-docker.pkg.dev/cicd-master-oxk5/helm-charts
    issuer: https://gitlab.com
    identities:
      - ^https://gitlab\.com/castai/kubecast//\.gitlab-ci\.yml@
      - ^https://gitlab\.com/castai/live/clm//\.gitlab-ci\.yml@
      - ^https://gitlab\.com/castai/stop/pv-monitor//\.gitlab-ci\.yml@
  # Charts built here by release.yaml, pushed straight to GHCR.
  github:
    registry: ghcr.io/castai/helm-charts
    issuer: https://token.actions.githubusercontent.com
    identities:
      - ^https://github\.com/castai/helm-charts/\.github/workflows/release\.yaml@refs/heads/main$
    # Only these charts are built here; every other charts/<dir> is a copy released elsewhere.
    charts:
      - castai # charts/castai-umbrella
      - castai-audit-logs-receiver
      - castai-chart-upgrader
      - castai-cloud-proxy
      - castai-db-agent
      - castai-db-optimizer
      - castai-db-proxy
      - castai-dbo
      - castai-hibernate
      - castai-hosted-model
      - castai-pod-node-lifecycle
      - castai-scheduling-policies-controller
      - gpu-metrics-exporter
  # castai/kontext, via the remote-release action.
  kontext:
    registry: ghcr.io/castai/kontext/helm-charts
    issuer: https://token.actions.githubusercontent.com
    identities:
      - ^https://github\.com/castai/kontext/\.github/workflows/release[-_][a-z_-]+\.yaml@refs/tags/
  # castai/gcp-disk-compatibility-webhook, via the remote-release action.
  gcp-disk-compatibility-webhook:
    registry: ghcr.io/castai/gcp-disk-compatibility-webhook/helm-charts
    issuer: https://token.actions.githubusercontent.com
    identities:
      - ^https://github\.com/castai/gcp-disk-compatibility-webhook/\.github/workflows/release\.yaml@refs/tags/
  # castai/castware-operator, via the remote-release action.
  castware-operator:
    registry: ghcr.io/castai/castware-operator/helm-charts
    issuer: https://token.actions.githubusercontent.com
    identities:
      - ^https://github\.com/castai/castware-operator/\.github/workflows/build\.yaml@refs/tags/
  # castai/ai-enabler, via the remote-release action.
  ai-enabler:
    registry: ghcr.io/castai/ai-enabler/helm-charts
    issuer: https://token.actions.githubusercontent.com
    identities:
      - ^https://github\.com/castai/ai-enabler/\.github/workflows/build-(proxy|batch-processor)\.yaml@refs/tags/
